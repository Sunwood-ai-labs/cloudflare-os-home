model_list:
  - model_name: bedrock-mantle-grok-4.3
    litellm_params:
      model: bedrock_mantle/xai.grok-4.3
      aws_region_name: us-east-1

  - model_name: bedrock-mantle-gpt-oss-20b
    litellm_params:
      model: bedrock_mantle/openai.gpt-oss-20b
      aws_region_name: us-east-1

  - model_name: glm-4.6
    litellm_params:
      model: zai/glm-4.6
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/ZAI_API_KEY
      max_parallel_requests: 3

  - model_name: glm-4.6v-flashx
    litellm_params:
      model: zai/glm-4.6v-flashx
