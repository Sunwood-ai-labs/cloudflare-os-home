name: Repository QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Build bilingual docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        run: npm ci
      - name: Build docs
        run: npm run docs:build

  structure:
    name: Check public repository structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up runner Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate Compose file
        shell: bash
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Validate optional coding-agent Compose file
        env:
          CODEX_AUTH_FILE: /tmp/cfos-ci-codex-auth.json
          ANTIGRAVITY_RUNTIME_DIR: /tmp/cfos-ci-antigravity-runtime
          ANTIGRAVITY_PROFILE_DIR: /tmp/cfos-ci-antigravity-profile
        run: docker compose -f docker-compose.yml -f docker-compose.agents.yml config --quiet
      - name: Syntax-check QA and runner scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find qa agent-runner -type f -name '*.mjs' -not -path '*/node_modules/*' -print)
      - name: Test agent-runner MCP sharing
        # Agent adapters and MCP/Pi round trips use local fixtures, without provider credentials.
        run: node --test agent-runner/*.test.mjs qa/live-mcp-evidence.test.mjs
      - name: Verify real Codex shell environment isolation
        # Match the runner image. Only synthetic credentials and loopback models are used.
        run: |
          npm install --prefix "${RUNNER_TEMP}/cfos-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.157.1
          PATH="${RUNNER_TEMP}/cfos-codex/node_modules/.bin:$PATH" node agent-runner/native-codex-mcp-smoke.mjs --check-environment
      - name: Reject private payloads
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files)"
          ! grep -E '(^|/)(\.env|secrets|qa/node_modules|artifacts|QA\.md|RESEARCH-LOG\.md|.*EXPERIMENT.*\.md|X-POSTING-WORKFLOW-LESSONS\.md)(/|$)' <<< "$tracked"
          test -f README.md
          grep -q 'cloudflare-os-home-lab' README.md
      - name: Check whitespace
        run: git diff --check
